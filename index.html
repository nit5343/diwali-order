<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Group Order</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0b08'/%3E%3Cg fill='none' stroke='%23ffd36b' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M16 3.5a12.5 12.5 0 0 1 12.2 9.8'/%3E%3Cpath d='M16 3.5a12.5 12.5 0 0 1 12.2 9.8' transform='rotate(120 16 16)'/%3E%3Cpath d='M16 3.5a12.5 12.5 0 0 1 12.2 9.8' transform='rotate(240 16 16)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='5.6' fill='%23f5a623'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23fffaf0'/%3E%3C/svg%3E">
<meta name="theme-color" content="#060609">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: slim sticky top bar, a status strip (lock countdown + who is signed in), segmented tabs and filters,
   a product grid, and a floating cart bar that opens a bottom sheet on phones and a drawer on desktop. */
:root {
  --bg: #0b0b0f; --surface: #15151b; --surface-2: #1e1e26; --ink: #f3f3f6; --ink-2: #c9c9d3; --muted: #8f8f9d; --line: #272730;
  --header: #060609; --primary: #f5a623; --on-primary: #1a1100; --gold: #f5a623; --gold-soft: #2b2110; --gold-ink: #ffcd6b;
  --ok: #4ccf8a; --ok-soft: #10261a; --err: #ff8a66; --err-soft: #2c160f; --tile: #f4f4f6;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px; --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: dark;
}

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); margin: 0; padding-bottom: 110px; -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--header) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px }
.num { font-variant-numeric: tabular-nums }
[hidden] { display: none !important }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--header); border-bottom: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,0); transition: box-shadow .25s }
.top.scrolled { box-shadow: 0 6px 24px rgba(0,0,0,.45) }
.top .wrap { height: 60px; display: flex; align-items: center; gap: 12px }
.top .wrap { position: relative }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 }
.bt { min-width: 0 }
.iconbtn { position: relative; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-sm); transition: transform .12s }
.iconbtn:active { transform: scale(.94) }
.iconbtn svg { width: 17px; height: 17px }
.on-dot { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); border: 2px solid var(--surface) }
.searchbox { position: absolute; inset: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; z-index: 5; background: var(--header); animation: searchin .22s var(--ease) both; margin: 0 }
.searchbox svg { width: 18px; height: 18px; color: var(--muted); flex: none; margin-left: 4px }
.searchbox input { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface); font-size: 16px }
.searchbox input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 8%, transparent) }
.searchbox button { border: 0; background: none; font-weight: 600; font-size: 14px; padding: 8px 4px; flex: none }
@keyframes searchin { from { opacity: 0; transform: translateY(-6px) } }
.mark { width: 36px; height: 36px; border-radius: 11px; background: radial-gradient(circle at 50% 45%, #2a1d08, #0d0b08 70%); border: 1px solid #2c2416; display: grid; place-items: center; flex: none; box-shadow: 0 0 18px rgba(245,166,35,.18) }
.mark svg { width: 30px; height: 30px; overflow: visible; filter: drop-shadow(0 0 3px rgba(255,190,80,.55)) }
.brand b { display: block; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.brand small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: -2px }
.acct { position: relative }
.gbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px 7px 10px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; box-shadow: var(--shadow-sm); transition: transform .15s var(--ease), box-shadow .2s }
.gbtn:hover { box-shadow: var(--shadow) }
.gbtn:active { transform: scale(.97) }
.gbtn svg { width: 18px; height: 18px }
.gsi { min-height: 32px; display: flex; align-items: center; justify-content: center; color-scheme: light; background: transparent }
/* Google's button frame is a light document; matching its color-scheme keeps the browser from painting a white box behind it on a dark page */
.gsi iframe { color-scheme: light; background: transparent !important }
.chip-acct { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; max-width: 280px; box-shadow: var(--shadow-sm) }
.chip-acct .em { font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; background: var(--av, #6b5bd6) }
@media (max-width: 900px) { .chip-acct { padding: 3px } .chip-acct .em { display: none } }
@media (max-width: 640px) { .bt { display: none } .brand { flex: none } .top .seg { flex: 1 1 auto; width: auto; min-width: 0; max-width: 260px; margin: 0 auto } .top .wrap { gap: 8px } .lg { display: none } }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; transform-origin: top right; animation: pop .18s var(--ease) }
.menu .lbl { font-size: 12px; color: var(--muted); font-weight: 600 }
.menu .em2 { font-weight: 600; overflow-wrap: anywhere }
.menu form { display: flex; gap: 8px }
.menu input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2) }
.menu a { color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none; padding-top: 10px; border-top: 1px solid var(--line) }

/* Status strip */
.status { margin-top: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow-sm); animation: rise .5s var(--ease) both }
.status .lk { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0 }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); animation: pulse 2s infinite }
.status[data-state="soon"] .dot { background: var(--gold); box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 55%, transparent) }
.status[data-state="locked"] .dot { background: var(--err); animation: none }
.lk b { font-weight: 700 }
.lk span { color: var(--muted); font-size: 13.5px }
.count { display: flex; gap: 6px }
.count div { background: var(--surface-2); border-radius: 8px; padding: 4px 8px; text-align: center; min-width: 46px }
.count b { display: block; font-size: 16px; font-weight: 700; line-height: 1.2 }
.count small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em }
.who { font-size: 13px; color: var(--muted); width: 100%; border-top: 1px dashed var(--line); padding-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.who b { color: var(--ink); font-weight: 600; overflow-wrap: anywhere }
.demo { margin-top: 10px; font-size: 12.5px; color: var(--gold-ink); background: var(--gold-soft); border-radius: 10px; padding: 8px 12px }

/* Tabs + filters */
.bar { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); z-index: 15; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding-block: 10px; display: flex; gap: 8px; align-items: center; margin-top: 4px }
.bar .chips { flex: 1; min-width: 0; margin: 0; padding: 0; mask-image: linear-gradient(90deg, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent) }
.sortsel { flex: none; height: 32px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; max-width: 120px }
.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; background: #16161c; border-radius: 12px; padding: 3px; width: 240px; flex: none }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 10px; font-weight: 600; font-size: 13.5px; color: var(--muted); border-radius: 9px; transition: color .2s; display: flex; align-items: center; justify-content: center; gap: 2px; white-space: nowrap }
.seg button[aria-selected="true"] { color: var(--ink) }
.seg .ind { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: #2a2a34; border-radius: 9px; box-shadow: var(--shadow-sm); transition: transform .35s var(--ease) }
.seg[data-tab="group"] .ind { transform: translateX(100%) }
.pill { font-size: 11px; font-weight: 700; background: var(--gold); color: #2a1a00; border-radius: 999px; padding: 0 7px; line-height: 18px }
.filters { display: flex; gap: 8px }
.search { position: relative; flex: 1; min-width: 0 }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted) }
.search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, box-shadow .2s }
.search input:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 8%, transparent) }
.filters select { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; max-width: 42% }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-snap-type: x proximity }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; scroll-snap-align: start; transition: background .2s, color .2s, border-color .2s }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary) }

/* Products */
section.cat { scroll-margin-top: 130px }
section.cat h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 10px; display: flex; gap: 8px; align-items: baseline }
section.cat h2 small { font-weight: 500; letter-spacing: 0 }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
@media (max-width: 960px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; transition: transform .25s var(--ease), box-shadow .25s, border-color .2s; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms) }
@media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: var(--shadow) } }
.card.in { border-color: color-mix(in srgb, var(--gold) 70%, var(--line)) }
.pic { position: relative; aspect-ratio: 1; background: var(--tile); display: grid; place-items: center; max-width: 100%; overflow: hidden }
.pic img { width: 100%; height: 100%; object-fit: contain; padding: 8px; transition: transform .4s var(--ease) }
@media (hover: hover) { .card:hover .pic img { transform: scale(1.04) } }
.pic .none { color: #9a9aa6; font-size: 12px }
.badge { position: absolute; top: 8px; left: 8px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; animation: pop .25s var(--ease) }
.off { position: absolute; top: 8px; right: 8px; background: var(--gold-soft); color: var(--gold-ink); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0 }
.name { font-weight: 600; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.pack { font-size: 12px; color: var(--muted) }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.rate { border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px }
.rate .st { color: var(--gold) }
.rate b { color: var(--ink); font-weight: 700 }
.rate:hover u { color: var(--ink) }
.rate u { text-decoration: underline dotted; text-underline-offset: 2px }
.vid { font-size: 12px; color: var(--muted); text-decoration: none }
.vid:hover { color: var(--ink) }
.prices { display: flex; align-items: baseline; gap: 6px; margin-top: auto; padding-top: 6px }
.price { font-weight: 800; font-size: 17px; letter-spacing: -.01em }
.mrp { font-size: 12px; color: var(--muted); text-decoration: line-through }
.ctl { margin-top: 8px; min-height: 38px }
.add { width: 100%; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .2s, border-color .2s, transform .12s }
.add:hover { border-color: var(--ink-2) }
.add:active { transform: scale(.97) }
.step { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; height: 38px; background: var(--primary); color: var(--on-primary); border-radius: 10px; overflow: hidden; animation: pop .22s var(--ease) }
.step button { border: 0; background: none; color: inherit; font-size: 18px; font-weight: 600; height: 100%; transition: background .15s }
.step button:active { background: rgba(127,127,127,.25) }
.step input { border: 0; background: transparent; color: inherit; text-align: center; width: 100%; font-weight: 700; -moz-appearance: textfield; padding: 0 }
.step input::-webkit-inner-spin-button { -webkit-appearance: none }
.card.sold .pic img { filter: grayscale(1); opacity: .55 }
.card.sold .price { color: var(--muted); text-decoration: line-through }
.oosb { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 8px; letter-spacing: .02em }
.oos { color: #ff8a80; font-weight: 600 }
.ctl .oosq { display: flex; gap: 6px; align-items: center }
.ctl .oosq .lockedq { flex: 1 }
.rm { height: 38px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-weight: 600; font-size: 13px }
.line .rm { height: 34px }
.lockedq { height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--ink-2) }
.empty { padding: 48px 0; text-align: center; color: var(--muted) }
.skel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.skel div { background: linear-gradient(90deg, var(--surface-2) 0%, color-mix(in srgb, var(--surface-2) 40%, var(--surface)) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 6px }
.skel .s1 { aspect-ratio: 1; border-radius: 0 } .skel .s2 { height: 12px; margin: 12px 12px 6px } .skel .s3 { height: 12px; width: 50%; margin: 0 12px 14px }

/* Floating cart bar */
.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 18; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; transform: translateY(130%); transition: transform .45s var(--ease) }
.cartbar.show { transform: none }
.cb { pointer-events: auto; max-width: 720px; margin: 0 auto; background: rgba(28,28,36,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid #33333f; color: var(--ink); border-radius: 18px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.25); cursor: pointer }
.cb .bag { position: relative; width: 36px; height: 36px; border-radius: 10px; background: rgba(127,127,127,.22); display: grid; place-items: center; flex: none }
.cb .bag svg { width: 18px; height: 18px }
.cb .bag i { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 999px; background: var(--gold); color: #2a1a00; font: 700 11px/20px var(--font); text-align: center; padding: 0 5px; font-style: normal }
.cb .sum { flex: 1; min-width: 0 }
.cb .sum b { font-size: 17px; font-weight: 800; display: inline-block }
.cb .sum b.bump { animation: bump .35s var(--ease) }
.save { display: block; font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 0; background: none; padding: 0; color: inherit; text-align: left; cursor: inherit; max-width: 100% }
.save[data-state="saved"]::before { content: "✓ "; color: #6be09a }
.save[data-state="saving"]::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; margin-right: 6px; vertical-align: -1px; animation: spin .7s linear infinite }
.save[data-state="error"] { opacity: 1; color: #ffb39b; cursor: pointer; text-decoration: underline }
.cb .go { border: 0; background: var(--gold); color: var(--on-primary); font-weight: 700; padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: transform .12s }
.cb .go:active { transform: scale(.96) }

/* Sheet: bottom sheet on phones, drawer on wider screens */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.6); animation: fade .25s ease both }
.panel { background: var(--surface); width: 100%; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px 22px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; align-content: start; animation: up .38s var(--ease) both }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; margin: 4px 0 2px }
@media (min-width: 760px) {
  .sheet { justify-content: flex-end; align-items: stretch }
  .panel { width: 460px; max-height: none; height: 100%; border-radius: 0; padding-top: calc(20px + env(safe-area-inset-top, 0px)); animation-name: slide }
  .grab { display: none }
}
.sheet.closing { animation: fadeout .2s ease both }
.sheet.closing .panel { animation: down .22s ease both }
@media (min-width: 760px) { .sheet.closing .panel { animation-name: slideout } }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.ph h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em }
.x { border: 0; background: var(--surface-2); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; line-height: 1; display: grid; place-items: center }
.lines { display: grid; gap: 12px }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr) 112px; gap: 12px; align-items: center; animation: rise .3s var(--ease) both }
.line img, .line .ph0 { width: 52px; height: 52px; object-fit: contain; background: var(--tile); border-radius: 10px; border: 1px solid var(--line); padding: 3px }
.line .n { font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere }
.line .n small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; margin-top: 2px }
.line .step, .line .lockedq { height: 34px }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); padding-top: 14px }
.total b { font-size: 22px; font-weight: 800 }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2) }
.field textarea { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 400; font-size: 15px; resize: vertical }
.note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px }
.note.ok { color: var(--ok); background: var(--ok-soft) }
.note.err { color: var(--err); background: var(--err-soft) }

.signin p { margin: 0; color: var(--muted); max-width: 34ch }

.fc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; animation: rise .4s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms) }

.fc.open .chev { transform: rotate(180deg) }

  }
  function loadGroup(quiet) {
    if (!quiet) $('groupBody').innerHTML = '<div class="stats">' + [0, 1, 2].map(function () { return '<div class="skel" style="height:70px"><div style="height:100%;border-radius:0"></div></div>' }).join('') + '</div>';
    call('getSummary').then(function (s) {
      $('groupCount').hidden = !s.friends.length; $('groupCount').textContent = s.friends.length;
      if (!s.friends.length) { $('groupBody').innerHTML = '<p class="empty">No carts yet. Start yours from the Shop tab.</p>'; return }
      var items = s.friends.reduce(function (a, f) { return a + f.items }, 0), canAdd = !isLocked() && !!me.email;
      closePop();
      var tx = splitCharge(config.tax, s), dl = splitCharge(config.delivery, s);
      // Who ordered each product in the shop list, keyed by product name like the summary's product rows.
      var who = {};
      s.friends.forEach(function (f) { f.lines.forEach(function (l) {
        if (l.soldOut) return;
        var w = who[l.name] = who[l.name] || { id: l.id, by: [] };
        w.by.push({ name: f.name, qty: l.qty });
      }) });
      Object.keys(who).forEach(function (k) { who[k].by.sort(function (a, b) { return b.qty - a.qty }) });
      $('groupBody').innerHTML =
        '<div class="stats"><div class="stat" style="--i:0"><span>People</span><b class="num">' + s.friends.length + '</b></div>' +
        '<div class="stat" style="--i:1"><span>Items</span><b class="num">' + items + '</b></div>' +
        '<div class="stat" style="--i:2"><span>Group total</span><b class="num">' + inr(s.total) + '</b></div></div>' +
        '<div class="gh"><h3>Everyone\'s carts</h3><button class="ghost" id="refresh">Refresh</button></div><div class="carts">' +
        s.friends.map(function (f, i) {
          var mine = !!me.email && f.name === me.name, open = openCarts[f.name] !== undefined ? openCarts[f.name] : (mine || s.friends.length <= 4);
          return '<div class="fc' + (mine ? ' mine' : '') + (open ? ' open' : '') + '" style="--i:' + i + '" data-fc="' + esc(f.name) + '">' +
            '<button class="hd" aria-expanded="' + open + '"><span class="avatar" style="--av:' + avatarColor(f.name) + '">' + esc(f.name.charAt(0).toUpperCase()) + '</span>' +
            '<span class="nm"><b>' + esc(f.name) + (mine ? '<em>You</em>' : '') + '</b><small>' + f.items + ' items · updated ' + esc(ago(f.updatedAt)) + '</small></span>' +
            '<span class="amt num">' + inr(f.amount + (tx[f.name] || 0) + (dl[f.name] || 0)) +
              (tx[f.name] || dl[f.name] ? '<small>' + inr(f.amount) + (tx[f.name] ? ' + ' + inr(tx[f.name]) + ' tax' : '') + (dl[f.name] ? ' + ' + inr(dl[f.name]) + ' delivery' : '') + '</small>' : '') + '</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>' +
            '<div class="bd"><div><ul>' + f.lines.map(function (l) {
              var p = byId[l.id];
              return '<li>' + (p && p.image ? '<img alt="" loading="lazy" referrerpolicy="no-referrer" src="' + esc(p.thumb) + '">' : '<span class="ph0"></span>') +
                '<span class="ln">' + esc(l.name) + '<small class="num">' + l.qty + ' × ' + inr(l.qty ? l.amount / l.qty : 0) + (l.soldOut ? ' · <span class="oos">Out of stock</span>, not counted' : ' = ' + inr(l.amount)) + '</small></span>' +
                (canAdd && !mine && p && !p.soldOut ? '<button class="plus" data-add="' + esc(l.id) + '">+ Add</button>' : '<span></span>') + '</li>';
            }).join('') + '</ul>' + (f.note ? '<p class="fnote">“' + esc(f.note) + '”</p>' : '') + '</div></div></div>';
        }).join('') + '</div>' +
        '<div class="gh"><h3>What we\'ll order from the shop</h3></div>' +
        '<div class="tblwrap"><table><thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead><tbody>' +
        s.products.map(function (p, i) {
          var w = who[p.name] || { id: '', by: [] };
          return '<tr><td>' + (w.id ? '<span class="pid num">#' + esc(w.id) + '</span>' : '') + esc(p.name) + '</td><td class="r num"><button class="qb num" data-who="' + i + '" aria-expanded="false" title="' + esc(w.by.map(function (b) { return b.name + ': ' + b.qty }).join(', ')) + '">' + p.qty + '</button></td><td class="r num">' + inr(p.amount) + '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
      $('groupBody').querySelectorAll('[data-who]').forEach(function (b) {
        var p = s.products[b.dataset.who], w = who[p.name] || { by: [] };
        b.removeAttribute('title');
        var hov = matchMedia('(hover: hover)').matches;
        b.onclick = function (e) { e.stopPropagation(); popWho(b, p, w.by, hov) };
        if (hov) { b.onmouseenter = function () { popWho(b, p, w.by, true) }; b.onmouseleave = function () { closePop() } }
      });
      $('refresh').onclick = function () { loadGroup() };
      $('groupBody').querySelectorAll('.fc .hd').forEach(function (h) {
        h.onclick = function () { var fc = h.parentNode, o = !fc.classList.contains('open'); fc.classList.toggle('open', o); h.setAttribute('aria-expanded', String(o)); openCarts[fc.dataset.fc] = o };
      });
      $('groupBody').querySelectorAll('[data-add]').forEach(function (b) {
        b.onclick = function () { if (!me.email) return askSignIn(); var id = b.dataset.add; setQty(id, (cart[id] || 0) + 1); toast('Added to your cart'); b.textContent = '✓ Added' };
      });
    }).catch(function (err) {
      if (err.message === 'SIGNED_OUT' || err.message === 'AUTH') { $('groupBody').innerHTML = '<div class="signin"><p>Sign in with Google to see what everyone is ordering.</p>' + gButton('Sign in with Google', true) + '</div>'; mountGsi($('groupBody')); return }
      if (!quiet) $('groupBody').innerHTML = '<p class="empty">Could not load the group carts. ' + esc(err.message) + '</p>';
    });
  }

  // Boot
  function boot(after) {
    call('getInitial').then(function (d) {
      config = d.config || {}; me = d.me || { email: null, name: null };
      products = d.products || []; byId = {}; cats = [];
      products.forEach(function (p) { p.id = String(p.id); byId[p.id] = p; if (cats.indexOf(p.category) < 0) cats.push(p.category); p.thumb = live && p.image ? 'img/' + p.id + '.webp' : p.image });
      cart = {}; ((d.order && d.order.items) || []).forEach(function (i) { if (byId[i.id]) cart[i.id] = i.qty });
      myNote = (d.order && d.order.note) || '';
      if (config.groupName) { $('groupName').textContent = config.groupName; document.title = config.groupName }
      renderChips(); renderList(); paintAccount(); paintLock(); paintBar(); paintSave(isLocked() ? 'locked' : cartLines().length ? 'saved' : 'idle');
      if (me.email || !live) call('getSummary').then(function (s) { $('groupCount').hidden = !s.friends.length; $('groupCount').textContent = s.friends.length }).catch(function () {});
      if (isLocked()) show('group'); else if (!$('groupView').hidden) loadGroup(true);
      if (after) after();
    }).catch(function (err) { $('list').innerHTML = '<p class="empty">Could not load the price list. ' + esc(err.message) + '</p>' });
  }
  boot();
})();
</script>

</body>
</html>
